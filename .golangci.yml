---
version: "2"
run:
  allow-parallel-runners: true
linters:
  default: fast
  disable:
    - wsl
    - gomodguard
  enable:
    - gosec
    - wsl_v5
    - gomodguard_v2
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - migrations/.*
      - ".*_test.go$"
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - migrations/.*
      - ".*_test.go$"
