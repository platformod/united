name: golangci

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  golangci:
    name: Run golang-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: 2026.9.2
          install: true
      - name: Run lint
        run: mise run lint
