name: golangci

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  golangci:
    name: Run golang-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          version: 2026.11.12
          install: true
      - name: Run lint
        run: mise run lint
