name: golangci

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  golangci:
    name: Run golang-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
        with:
          version: 2026.11.10
          install: true
      - name: Run lint
        run: mise run lint
