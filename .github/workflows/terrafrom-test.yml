name: terraform test

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  terraform-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/*.sum"

      - name: Get Terraform version
        id: tf_ver
        run: echo "ver=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9 # v4
        with:
          terraform_version: ${{ steps.tf_ver.outputs.ver }}

      - name: Run Terraform integration test
        run: UNITED_STATE_MASTER_KEY="$(openssl rand -base64 32)" make test
