name: Pre-Commit

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  precommit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: 2026.9.16
          install: true
      - name: Run lint
        run: mise run check:ci
