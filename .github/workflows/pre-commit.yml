name: Pre-Commit

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  precommit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
        with:
          version: 2026.9.16
          install: true
      - name: Run lint
        run: mise run check:ci
