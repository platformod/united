name: Pre-Commit

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  precommit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        with:
          version: 2026.10.21
          install: true
      - name: Run lint
        run: mise run check:ci
