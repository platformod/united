name: Pre-Commit

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  precommit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.11.5
          install: true
      - name: Run lint
        run: mise run check:ci
