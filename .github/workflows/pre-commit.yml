name: Pre-Commit

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  precommit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          version: 2026.11.8
          install: true
      - name: Run lint
        run: mise run check:ci
